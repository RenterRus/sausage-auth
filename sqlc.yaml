version: 2
servers:
- engine: postgresql
  uri: "postgres://locahost:5432/postgres?sslmode=disable"
sql:
- schema: "docs/migrations/"
  queries: "docs/migrations/queries/"
  engine: "postgresql"
  gen:
    go:
      package: "db"
      sql_package: "pgx/v5"
      out: "internal/repo/psql/db"
      emit_db_tags: true
      emit_pointers_for_null_types: true
      emit_sql_as_comment: true
      emit_interface: true

      # naming output files with *.sqlcgen.go suffix
      output_batch_file_name: "batch.sqlcgen.go" 
      output_db_file_name: "db.sqlcgen.go"
      output_models_file_name: "models.sqlcgen.go"
      output_querier_file_name: "querier.sqlcgen.go"
      output_copyfrom_file_name: "copyfrom.sqlcgen.go"
      output_files_suffix: "cgen" 
      
      overrides:
        # -- uuid overrides --
        - db_type: "uuid"
          go_type:
            type: "string"
        - db_type: "uuid"
          nullable: true
          go_type:
            pointer: true
            type: "string"
        # -- timestamptz overrides --
        - db_type: "timestamptz"
          nullable: true
          go_type:
            pointer: true
            import: "time"
            type: "Time"
        - db_type: "timestamptz"
          go_type:
            import: "time"
            type: "Time"
        