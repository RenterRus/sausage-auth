syntax = "proto3";
package auth.v1;

option go_package = "github.com/RenterRus/sausage-auth/auth/pb/auth/v1;authpb";


message RegisterRequest {
  string login = 1;
}

message RegisterResponse{
  string url = 1;
}

message AcceptRequest {
  string login = 1;
  string otp_code = 2;
}

message AcceptResponse{
  string status = 1;
}

message RevokeSessionRequest{
  message Current{
    string hash = 1;
  }

  message All{
      string login = 1;
  }

  oneof mode{
    Current current = 1;
    All all = 2;
  }

}

message RevokeSessionResponse{
  string status = 1;
}

message ValidateTokenRequest{
  string access = 1;
}

message ValidateTokenResponse{
  string uuid = 1;
}

message Tokens{
  string access = 1;
  string refresh = 2;
}

message LoginOTPRequest{
  string login = 1;
  string userAgent = 2;
  string code = 3;
}

message LoginOTPResponse{
  Tokens tokens = 1;
  string uuid = 2;
}

message RefreshRequest{
  string userAgent = 1;
  string refreshToken = 2;
}

message RefreshResponse{
  Tokens tokens = 1;
  string uuid = 2;
}


message UrlOTPRequest{
  string access = 1;
}

message UrlOTPResponse{
  string url = 1;
}




service AuthService {

  
    rpc Register(RegisterRequest) returns (RegisterResponse);
    
    rpc Confirm(AcceptRequest) returns (AcceptResponse);

    rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  
    rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

    rpc LoginOTP(LoginOTPRequest) returns (LoginOTPResponse);
    rpc UrlOTP(UrlOTPRequest) returns (UrlOTPResponse);

    rpc RefreshToken(RefreshRequest) returns (RefreshResponse);
}
